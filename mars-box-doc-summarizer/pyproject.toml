[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "box-doc-summarizer"
version = "0.1.0"
description = "Box Doc Summarizer — LangGraph MARS agent that briefs a Box folder and writes one executive summary back"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langgraph>=1.0",
  "langchain-core>=0.3",
  "langgraph-checkpoint>=2.0",
  "requests>=2.31",
  "pyjwt[crypto]>=2.8",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
